# /etc/nginx/sites-available/toss-invest-mcp
# HTTPS 는 certbot --nginx -d mcp.example.com 으로 붙이세요.
# <MCP_PATH_SECRET> 을 실제 값으로 바꾸고, PUBLIC_HOST=mcp.example.com 도 설정하세요.
server {
    listen 80;
    server_name mcp.example.com;
    access_log off;   # URL 경로에 비밀값이 있으므로 로그를 남기지 않음

    location ^~ /<MCP_PATH_SECRET>/mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8000; }
    location / { return 404; }
}
